<div class="page-header">
  <div class="header-content">
    <h1>Payment Hub</h1>
    <p class="subtitle">Manage your course fees and pending payments.</p>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="loading-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 0;">
  <div class="spinner" style="width: 40px; height: 40px; border: 3px solid rgba(0,0,0,0.1); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;"></div>
  <p style="margin-top: 1rem; color: var(--text-secondary);">Loading your payments...</p>
</div>

<!-- Empty State -->
<div *ngIf="!isLoading && pendingPayments.length === 0" class="empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); text-align: center;">
  <div class="empty-icon" style="width: 64px; height: 64px; background: rgba(34, 197, 94, 0.1); color: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 1.5rem;">
    <i class="fi fi-rr-check"></i>
  </div>
  <h3 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">All Caught Up!</h3>
  <p style="color: var(--text-secondary); max-width: 400px;">You have no pending course fees. Enjoy your learning journey.</p>
</div>

<!-- Grid -->
<div *ngIf="!isLoading && pendingPayments.length > 0" class="course-grid">
  <div *ngFor="let payment of pendingPayments" class="course-card">
    <div class="card-glass-effect"></div>
    
    <div class="card-header">
      <span class="status-badge" [ngClass]="{'active': payment.status === 'Pending', 'archived': payment.status === 'Failed'}">
        {{ payment.status }}
      </span>
      <span style="font-size: 0.75rem; color: var(--text-secondary);">{{ payment.createdAt | date:'mediumDate' }}</span>
    </div>
    
    <div class="card-body">
      <h3 class="course-title" [title]="payment.courseName">{{ payment.courseName }}</h3>
      
      <div style="margin-top: 1.5rem;">
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem;">Course Fee</p>
        <p style="font-size: 1.75rem; font-weight: 700; color: var(--text-primary);">${{ payment.amountUSD }} <span style="font-size: 0.9rem; font-weight: 400; color: var(--text-secondary);">USD</span></p>
      </div>
    </div>
    
    <div class="card-footer" style="padding-top: 1rem; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.02);">
      <button 
        (click)="payCourseFee(payment)" 
        [disabled]="isProcessing"
        class="btn btn-primary" style="width: 100%; justify-content: center;">
        <i class="fi" [ngClass]="isProcessing ? 'fi-rr-spinner animate-spin' : 'fi-brands-stripe'" style="margin-right: 0.5rem;"></i>
        {{ isProcessing ? 'Processing...' : 'Pay with Stripe' }}
      </button>
    </div>
  </div>
</div>
