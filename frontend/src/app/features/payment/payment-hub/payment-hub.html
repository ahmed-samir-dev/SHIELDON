<div class="container mx-auto p-6 max-w-5xl">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
        <i class="fi fi-rr-wallet text-indigo-600"></i>
        Payment Hub
      </h1>
      <p class="text-gray-500 mt-2">Manage your course fees and pending payments.</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
  </div>

  <div *ngIf="!isLoading && pendingPayments.length === 0" class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center">
    <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fi fi-rr-check text-3xl"></i>
    </div>
    <h3 class="text-xl font-semibold text-gray-900 mb-2">All Caught Up!</h3>
    <p class="text-gray-500 max-w-md mx-auto">You have no pending course fees. Enjoy your learning journey.</p>
  </div>

  <div *ngIf="!isLoading && pendingPayments.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let payment of pendingPayments" class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
            {{ payment.status }}
          </span>
          <span class="text-xs text-gray-500">
            {{ payment.createdAt | date:'mediumDate' }}
          </span>
        </div>
        
        <h3 class="text-lg font-bold text-gray-900 mb-2 line-clamp-2" [title]="payment.courseName">
          {{ payment.courseName }}
        </h3>
        
        <div class="flex items-end justify-between mt-6">
          <div>
            <p class="text-sm text-gray-500 mb-1">Course Fee</p>
            <p class="text-2xl font-bold text-gray-900">${{ payment.amountUSD }} <span class="text-sm font-normal text-gray-500">USD</span></p>
          </div>
        </div>
      </div>
      
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-100">
        <button 
          (click)="payCourseFee(payment)" 
          [disabled]="isProcessing"
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition-colors disabled:opacity-70 disabled:cursor-not-allowed">
          <i class="fi" [ngClass]="isProcessing ? 'fi-rr-spinner animate-spin' : 'fi-brands-stripe'"></i>
          {{ isProcessing ? 'Processing...' : 'Pay with Stripe' }}
        </button>
      </div>
    </div>
  </div>
</div>
