<!-- Modal Backdrop & Container -->
<div class="modal-overlay">
  <div 
    class="modal-backdrop" 
    [@backdropAnimation]
    (click)="close.emit()">
  </div>

  <!-- Modal Panel -->
  <div 
    class="modal-panel"
    [@modalAnimation]>
    
    <!-- Header -->
    <div class="modal-header">
      <h3 class="modal-title">
        {{ isEditMode ? ('EVENT_MODAL.TITLE_EDIT' | translate) : ('EVENT_MODAL.TITLE_CREATE' | translate) }}
      </h3>
      <button 
        type="button" 
        (click)="close.emit()"
        class="modal-close-btn">
        <lucide-icon [img]="icons.X" size="20"></lucide-icon>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="modal-form">
      
      <!-- Title -->
      <div class="form-group">
        <label for="title" class="form-label">{{ 'EVENT_MODAL.LABEL_TITLE' | translate }} <span class="required-asterisk">*</span></label>
        <div class="input-wrapper">
          <div class="input-icon">
            <lucide-icon [img]="icons.Type" size="18"></lucide-icon>
          </div>
          <input 
            type="text" 
            id="title" 
            formControlName="title"
            class="form-input"
            [placeholder]="'EVENT_MODAL.PLACEHOLDER_TITLE' | translate"
          >
        </div>
        <div *ngIf="eventForm.get('title')?.touched && eventForm.get('title')?.errors?.['required']" class="error-message">
          {{ 'EVENT_MODAL.ERR_TITLE_REQUIRED' | translate }}
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description" class="form-label">{{ 'EVENT_MODAL.LABEL_DESC' | translate }}</label>
        <div class="input-wrapper textarea-wrapper">
          <div class="input-icon textarea-icon">
            <lucide-icon [img]="icons.AlignLeft" size="18"></lucide-icon>
          </div>
          <textarea 
            id="description" 
            formControlName="description"
            rows="3"
            class="form-input form-textarea"
            [placeholder]="'EVENT_MODAL.PLACEHOLDER_DESC' | translate"
          ></textarea>
        </div>
      </div>

      <!-- Dates -->
      <div class="form-row">
        <!-- Start Date -->
        <div class="form-group">
          <label for="eventDate" class="form-label">{{ 'EVENT_MODAL.LABEL_START' | translate }} <span class="required-asterisk">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <lucide-icon [img]="icons.Clock" size="18"></lucide-icon>
            </div>
            <input 
              type="datetime-local" 
              id="eventDate" 
              formControlName="eventDate"
              class="form-input"
            >
          </div>
        </div>

        <!-- End Date -->
        <div class="form-group">
          <label for="eventEndDate" class="form-label">{{ 'EVENT_MODAL.LABEL_END' | translate }}</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <lucide-icon [img]="icons.Clock" size="18"></lucide-icon>
            </div>
            <input 
              type="datetime-local" 
              id="eventEndDate" 
              formControlName="eventEndDate"
              class="form-input"
            >
          </div>
        </div>
      </div>

      <!-- Course Selection -->
      <div class="form-group">
        <label for="courseId" class="form-label">{{ 'EVENT_MODAL.LABEL_COURSE' | translate }}</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <lucide-icon [img]="icons.BookOpen" size="18"></lucide-icon>
          </div>
          <select 
            id="courseId" 
            formControlName="courseId"
            class="form-input form-select"
          >
            <option *ngIf="isAdmin" value="">{{ 'EVENT_MODAL.OPTION_GLOBAL' | translate }}</option>
            <option *ngIf="!isAdmin" value="" disabled selected>{{ 'EVENT_MODAL.OPTION_SELECT_COURSE' | translate }}</option>
            <option *ngFor="let course of courses" [value]="course.id">
              {{ course.courseCode }} - {{ course.title }}
            </option>
          </select>
          <div class="select-chevron">
            <svg class="chevron-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="modal-footer">
        <div class="footer-left">
          <button 
            *ngIf="isEditMode"
            type="button"
            (click)="onDelete()"
            class="btn-danger">
            {{ 'EVENT_MODAL.BTN_DELETE' | translate }}
          </button>
        </div>
        <div class="footer-right">
          <button 
            type="button" 
            (click)="close.emit()"
            class="btn-secondary">
            {{ 'EVENT_MODAL.BTN_CANCEL' | translate }}
          </button>
          <button 
            type="submit" 
            [disabled]="eventForm.invalid"
            class="btn-primary">
            {{ isEditMode ? ('EVENT_MODAL.BTN_SAVE' | translate) : ('EVENT_MODAL.BTN_CREATE' | translate) }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
