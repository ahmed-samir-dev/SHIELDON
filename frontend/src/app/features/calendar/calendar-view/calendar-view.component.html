<div class="calendar-page">
  <!-- Premium Header -->
  <div class="calendar-header">
    <div class="header-bg-decor1"></div>
    <div class="header-bg-decor2"></div>
    
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">
          <div class="icon-wrapper">
          <lucide-icon [img]="icons.CalendarIcon" class="title-icon"></lucide-icon>
        </div>
        <span>{{ 'CALENDAR_VIEW.TITLE' | translate }}</span>
      </h1>
      <p class="page-subtitle">
          {{ 'CALENDAR_VIEW.SUBTITLE' | translate }}
        </p>
      </div>

      <!-- Actions -->
    <div class="action-section">
      <button 
        *ngIf="isAdmin || isTutor"
        (click)="openModal()"
        class="btn-primary">
        <lucide-icon [img]="icons.Plus" class="btn-icon"></lucide-icon>
        <span>{{ 'CALENDAR_VIEW.BTN_NEW_EVENT' | translate }}</span>
      </button>
    </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="calendar-legend">
    <div class="legend-items-left">
      <span class="legend-label">{{ 'CALENDAR_VIEW.LEGEND_LABEL' | translate }}</span>
      
      <button 
        class="legend-item legend-exam" 
        [class.legend-inactive]="!legendFilters.exam"
        (click)="toggleFilter('exam')"
        type="button">
        <div class="legend-dot dot-exam"></div>
        <span class="legend-text">{{ 'CALENDAR_VIEW.LEGEND_EXAM' | translate }}</span>
      </button>
      
      <button 
        class="legend-item legend-assignment" 
        [class.legend-inactive]="!legendFilters.assignment"
        (click)="toggleFilter('assignment')"
        type="button">
        <div class="legend-dot dot-assignment"></div>
        <span class="legend-text">{{ 'CALENDAR_VIEW.LEGEND_ASSIGNMENT' | translate }}</span>
      </button>
      
      <button 
        class="legend-item legend-custom" 
        [class.legend-inactive]="!legendFilters.courseEvent"
        (click)="toggleFilter('courseEvent')"
        type="button">
        <div class="legend-dot dot-custom"></div>
        <span class="legend-text">{{ 'CALENDAR_VIEW.LEGEND_COURSE_EVENT' | translate }}</span>
      </button>
      
      <button 
        class="legend-item legend-global" 
        [class.legend-inactive]="!legendFilters.globalEvent"
        (click)="toggleFilter('globalEvent')"
        type="button">
        <div class="legend-dot dot-global"></div>
        <span class="legend-text">{{ 'CALENDAR_VIEW.LEGEND_GLOBAL_EVENT' | translate }}</span>
      </button>
    </div>
    
    <div class="legend-hint">
      <span>{{ 'CALENDAR_VIEW.FILTER_HINT' | translate }}</span>
    </div>
  </div>

  <!-- Calendar Container -->
  <div class="calendar-container">
    
    <!-- Loading Overlay -->
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner-container">
        <div class="spinner-pulse"></div>
        <div class="spinner-ring"></div>
      </div>
      <span class="loading-text">{{ 'CALENDAR_VIEW.LOADING' | translate }}</span>
    </div>

    <!-- FullCalendar -->
    <div class="calendar-wrapper" [class.loading]="isLoading">
      <full-calendar 
        *ngIf="calendarVisible" 
        #calendar
        [options]="calendarOptions">
      </full-calendar>
    </div>
  </div>
</div>

<!-- Event Modal -->
<app-event-modal
  *ngIf="showModal"
  [event]="selectedEvent"
  [initialDate]="selectedDate"
  [courses]="courses"
  [isAdmin]="isAdmin"
  (save)="saveEvent($event)"
  (delete)="deleteEvent($event)"
  (close)="closeModal()">
</app-event-modal>
