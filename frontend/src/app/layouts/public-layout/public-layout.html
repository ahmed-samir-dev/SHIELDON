<div class="public-layout-container">
  <nav class="top-nav">
    <div class="nav-content container">
      <a routerLink="/" class="logo animate-fade-in">
        SHIELDON
      </a>
      <div class="nav-links">
        <!-- Language Toggle -->
        <button class="theme-toggle-btn language-toggle-btn" (click)="languageService.toggleLanguage()" [attr.title]="languageService.getCurrentLanguage() === 'en' ? 'Switch to Arabic' : 'Switch to English'" style="font-weight: 600; font-size: 14px;">
          {{ languageService.getCurrentLanguage() === 'en' ? 'AR' : 'EN' }}
        </button>
        <button class="theme-toggle-btn" (click)="themeService.toggleTheme()" [attr.title]="themeService.activeTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          @if (themeService.activeTheme() === 'dark') {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          }
        </button>
        <a routerLink="/login" class="nav-link">{{ 'PUBLIC.LOGIN' | translate }}</a>
        <a routerLink="/register" class="nav-btn">{{ 'PUBLIC.GET_STARTED' | translate }}</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <!-- Line 1: Centered Brand & Copyright -->
      <div class="footer-main-row">
        <span class="brand">SHIELDON</span>
        <span class="copyright-text">{{ 'PUBLIC.FOOTER_COPYRIGHT' | translate }}</span>
      </div>

      <!-- Line 2: Centered Developer Attribution Pill -->
      <div class="footer-dev-row">
        <div class="developer-attribution">
          <span class="dev-text">
            <lucide-icon [img]="Code" size="14" class="code-icon"></lucide-icon>
            {{ 'PUBLIC.DEVELOPED_BY' | translate }} 
            <span class="dev-name">{{ 'PUBLIC.DEV_NAME' | translate }}</span>
          </span>

          <div class="social-pills">
            <a href="mailto:ahmed.samir.software@gmail.com" class="social-pill pill-email" title="Email: ahmed.samir.software@gmail.com" aria-label="Email Ahmed Samir">
              <lucide-icon [img]="Mail" size="14"></lucide-icon>
            </a>
            <a href="https://github.com/ahmed-samir-dev" target="_blank" rel="noopener noreferrer" class="social-pill pill-github" title="GitHub: ahmed-samir-dev" aria-label="GitHub Profile">
              <lucide-icon [img]="Github" size="14"></lucide-icon>
            </a>
            <a href="https://www.linkedin.com/in/swe-ahmed-samir/" target="_blank" rel="noopener noreferrer" class="social-pill pill-linkedin" title="LinkedIn: swe-ahmed-samir" aria-label="LinkedIn Profile">
              <lucide-icon [img]="Linkedin" size="14"></lucide-icon>
            </a>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>
