<div class="otp-backdrop" *ngIf="isOpen" (click)="onClose()">
  <div class="otp-dialog scale-in" (click)="$event.stopPropagation()">
    
    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()" type="button" aria-label="Close modal">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>

    <!-- SUCCESS ANIMATION STATE -->
    <div class="success-state" *ngIf="isSuccess()">
      <div class="success-icon-badge bounce-in">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      </div>
      <h3>Phone Verified!</h3>
      <p>Your phone number <strong>{{ phoneNumber }}</strong> is now verified.</p>
    </div>

    <!-- REGULAR OTP STATE -->
    <div class="otp-body" *ngIf="!isSuccess()">
      
      <!-- Header -->
      <div class="otp-header">
        <div class="icon-ring pulse whatsapp-ring">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </div>
        <h2>WhatsApp Verification</h2>
        <p class="subtitle">Enter the 6-digit code sent to your WhatsApp <strong class="phone-badge">{{ phoneNumber }}</strong></p>
      </div>

      <!-- Action Button to Trigger Code -->
      <div class="send-action-wrapper" *ngIf="countdown() === 0">
        <button 
          type="button" 
          class="btn-send-code" 
          (click)="sendOtp()" 
          [disabled]="isSending()">
          <span *ngIf="!isSending()">Send Code via WhatsApp</span>
          <div class="spinner-small" *ngIf="isSending()"></div>
        </button>
      </div>

      <!-- Countdown Active Banner -->
      <div class="resend-banner" *ngIf="countdown() > 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Resend code available in <strong>{{ formatCountdown }}</strong></span>
      </div>

      <!-- Error Message -->
      <div class="alert-banner alert-danger slide-down" *ngIf="errorMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- 6-Digit OTP Code Inputs -->
      <div class="otp-inputs-grid">
        <input 
          #digitInput
          *ngFor="let digit of otpDigits(); let i = index; trackBy: trackByIndex"
          type="text" 
          inputmode="numeric"
          maxlength="1"
          autocomplete="off"
          class="otp-box"
          [class.filled]="digit !== ''"
          [class.is-invalid]="errorMessage() !== null"
          [value]="digit"
          (input)="onDigitInput($event, i)"
          (keydown)="onKeyDown($event, i)"
          (paste)="onPaste($event)"
          (focus)="onFocus($event)"
          [disabled]="isVerifying()">
      </div>

      <!-- Verify Button -->
      <button 
        type="button" 
        class="btn-verify-glow" 
        (click)="verifyOtp()" 
        [disabled]="otpDigits().join('').length !== 6 || isVerifying()">
        <span *ngIf="!isVerifying()">Verify & Confirm</span>
        <div class="spinner-small" *ngIf="isVerifying()"></div>
      </button>

    </div>
  </div>
</div>
