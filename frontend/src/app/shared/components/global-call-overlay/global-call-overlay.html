<!-- WebRTC: Incoming Call Notification -->
@if (isIncomingCall()) {
  <div class="incoming-call-overlay">
    <div class="incoming-call-card">
      <div class="incoming-call-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <p class="incoming-call-name">{{ incomingCallerName() ?? 'Unknown' }}</p>
      <p class="incoming-call-subtitle">Incoming Video Call…</p>
      <div class="incoming-call-actions">
        <button class="btn-reject-call" (click)="rejectCall()" title="Reject">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
        </button>
        <button class="btn-accept-call" (click)="acceptCall()" title="Accept">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </div>
  </div>
}

<!-- WebRTC: Active Call Modal -->
@if (isInCall()) {
  <div class="webrtc-overlay">
    <div class="webrtc-modal">
      <div class="webrtc-header">
        <h3>{{ callTargetName() ?? incomingCallerName() }}</h3>
        <span class="call-status">{{ remoteStream() ? 'Connected' : 'Calling…' }}</span>
      </div>
      <div class="webrtc-videos">
        <video #localVideo autoplay muted playsinline></video>
        <video #remoteVideo autoplay playsinline [class.hidden]="!remoteStream()"></video>
        @if (!remoteStream()) {
          <div class="calling-indicator">
            <div class="calling-pulse"></div>
            <p>Waiting for answer…</p>
          </div>
        }
      </div>
      <div class="webrtc-controls">
        <button class="btn-end-call" (click)="endCall()" title="End Call">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
        </button>
      </div>
    </div>
  </div>
}
